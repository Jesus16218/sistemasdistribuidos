global
    log stdout format raw local0

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

# NOTE: this is a basic TCP-connect healthcheck (the port answers). It does
# NOT verify wsrep_cluster_status = Primary, so a node that is up but has
# fallen out of the Galera cluster (split-brain) would still look "healthy"
# here. A production setup should use the `clustercheck` script instead
# (see TEST-PLAN.md "Gaps the tests will likely expose").
frontend galera_front
    bind *:3306
    default_backend galera_nodes

backend galera_nodes
    balance leastconn
    option tcp-check
    tcp-check connect
    server galera1 galera1:3306 check inter 2s fall 3 rise 2
    server galera2 galera2:3306 check inter 2s fall 3 rise 2
    server galera3 galera3:3306 check inter 2s fall 3 rise 2
